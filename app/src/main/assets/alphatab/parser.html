<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <!-- Невидимая страница: разбирает файл Guitar Pro и отдаёт ноты в приложение. -->
    <script src="alphaTab.min.js"></script>
</head>
<body>
<script>
    const QUARTER_TICKS = 960; // длительность четверти в тиках AlphaTab

    /**
     * Время тактов с учётом смены темпа (в том числе посреди такта).
     * Для каждого такта: t — начало в мс, msAt(тик внутри такта) — смещение в мс,
     * num/den — размер, dur — длительность в тиках.
     */
    function buildTiming(score) {
      const bars = [];
      let bpm = score.tempo || 120;
      let t = 0;
      for (const masterBar of score.masterBars) {
        const dur = masterBar.calculateDuration();
        const automations = (masterBar.tempoAutomations || [])
            .slice()
            .sort((a, b) => a.ratioPosition - b.ratioPosition);

        const segments = [{ tick: 0, bpm: bpm }];
        for (const a of automations) {
          const tick = a.ratioPosition * dur;
          if (tick <= 0) segments[0].bpm = a.value;
          else segments.push({ tick: tick, bpm: a.value });
        }

        const msAt = (tick) => {
          let ms = 0;
          for (let i = 0; i < segments.length; i++) {
            const from = segments[i].tick;
            const to = i + 1 < segments.length ? Math.min(segments[i + 1].tick, tick) : tick;
            if (to <= from) break;
            ms += (to - from) * 60000 / (segments[i].bpm * QUARTER_TICKS);
          }
          return ms;
        };

        bars.push({
          t: t, msAt: msAt, dur: dur,
          num: masterBar.timeSignatureNumerator,
          den: masterBar.timeSignatureDenominator
        });
        t += msAt(dur);
        bpm = segments[segments.length - 1].bpm;
      }
      return bars;
    }

    // щелчки метронома: каждая доля такта, первая — с акцентом. [[мс, 1|0], ...]
    function buildClicks(bars) {
      const clicks = [];
      for (const bar of bars) {
        const beatTicks = QUARTER_TICKS * 4 / bar.den;
        for (let k = 0; k < bar.num; k++) {
          const tick = k * beatTicks;
          if (tick >= bar.dur) break; // неполный (затактовый) такт
          clicks.push([round1(bar.t + bar.msAt(tick)), k === 0 ? 1 : 0]);
        }
      }
      return clicks;
    }

    function round1(ms) {
      return Math.round(ms * 10) / 10;
    }

    // Номер струны в AlphaTab: 1 = самая толстая. staff.tuning: от верхней струны к нижней.
    // Каждый шаг: { n: [[струна, лад, midi], ...], c: "аккорд", b: такт с 0, t: начало мс, d: длительность мс }
    function extractTrack(track, index, timing) {
      const staff = track.staves[0];
      const result = {
        index: index,
        name: track.name || ('Дорожка ' + (index + 1)),
        percussion: !!staff.isPercussion,
        tuning: staff.tuning.slice(),
        capo: staff.capo,
        steps: []
      };
      if (staff.isPercussion || staff.tuning.length === 0) return result;

      result.barCount = staff.bars.length;
      for (let barIndex = 0; barIndex < staff.bars.length; barIndex++) {
        const bar = staff.bars[barIndex];
        const voice = bar.voices[0];
        if (!voice) continue;
        const barTiming = timing[barIndex];

        for (const beat of voice.beats) {
          // паузы и форшлаги пропускаем
          if (beat.isRest || beat.isEmpty || beat.graceType !== 0) continue;

          // продолжения лиги и мёртвые ноты (x) заново не играются
          const notes = [];
          for (const note of beat.notes) {
            if (note.isTieDestination || note.isDead || !note.isStringed) continue;
            // stringTuning уже учитывает каподастр
            notes.push([note.string, note.fret, note.fret + note.stringTuning]);
          }
          if (notes.length === 0) continue;

          let chordName = '';
          try {
            if (notes.length > 1 && beat.chord && beat.chord.name) chordName = beat.chord.name;
          } catch (e) {
            // название аккорда необязательно
          }

          const step = { n: notes, c: chordName, b: barIndex };
          if (barTiming) {
            const start = barTiming.msAt(beat.playbackStart);
            step.t = round1(barTiming.t + start);
            step.d = round1(barTiming.msAt(beat.playbackStart + beat.playbackDuration) - start);
          }
          result.steps.push(step);
        }
      }
      return result;
    }

    function parseSong(base64) {
      try {
        const binary = atob(base64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);

        const score = alphaTab.importer.ScoreLoader.loadScoreFromBytes(bytes, new alphaTab.Settings());
        const timing = buildTiming(score);
        const song = {
          title: score.title || '',
          artist: score.artist || '',
          tempo: score.tempo || 120,
          clicks: buildClicks(timing),
          tracks: score.tracks.map((track, i) => extractTrack(track, i, timing))
        };
        Android.onParsed(JSON.stringify(song));
      } catch (e) {
        Android.onParseError(String((e && e.message) || e));
      }
    }

    window.parseSong = parseSong;
</script>
</body>
</html>
